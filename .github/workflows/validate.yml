name: validate

# This branch holds only the attendee-facing session material, so the one
# thing worth checking is that the documents themselves stay clean. The
# PowerShell and repo-consistency jobs live on the `facilitator` branch,
# together with the scripts they check.
on:
  push:
  pull_request:

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Rules and ignores come from .markdownlint-cli2.jsonc, so this is
      # byte-for-byte what anyone runs locally.
      - name: Lint every markdown file
        run: npx --yes markdownlint-cli2 "**/*.md"
